<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f5f7fa"/>

  <!-- Circuit board pattern -->
  <defs>
    <pattern id="circuit" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#d0d0d0"/>
      <circle cx="50" cy="10" r="2" fill="#d0d0d0"/>
      <circle cx="90" cy="10" r="2" fill="#d0d0d0"/>
      <circle cx="10" cy="50" r="2" fill="#d0d0d0"/>
      <circle cx="50" cy="50" r="2" fill="#d0d0d0"/>
      <circle cx="90" cy="50" r="2" fill="#d0d0d0"/>
      <circle cx="10" cy="90" r="2" fill="#d0d0d0"/>
      <circle cx="50" cy="90" r="2" fill="#d0d0d0"/>
      <circle cx="90" cy="90" r="2" fill="#d0d0d0"/>
      <line x1="10" y1="10" x2="50" y2="10" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="50" y1="10" x2="50" y2="50" stroke="#e0e0e0" stroke-width="1"/>
      <line x1="10" y1="50" x2="90" y2="50" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#circuit)" opacity="0.3"/>

  <!-- Flight Controller PCB -->
  <rect x="200" y="150" width="180" height="120" fill="#2e7d32" rx="4"/>

  <!-- Components on PCB -->
  <rect x="220" y="170" width="40" height="40" fill="#333" rx="2"/>
  <text x="240" y="195" font-family="monospace" font-size="10" text-anchor="middle" fill="white">F405</text>

  <rect x="280" y="170" width="30" height="20" fill="#666"/>
  <rect x="330" y="170" width="30" height="20" fill="#666"/>

  <!-- Connectors -->
  <rect x="210" y="240" width="160" height="10" fill="#ffd54f"/>
  <rect x="210" y="220" width="10" height="10" fill="#ff6b6b"/>
  <rect x="230" y="220" width="10" height="10" fill="#51cf66"/>
  <rect x="250" y="220" width="10" height="10" fill="#339af0"/>

  <!-- ESC Module -->
  <rect x="420" y="150" width="180" height="120" fill="#1e3a5f" rx="4"/>

  <!-- ESC Components -->
  <rect x="440" y="170" width="140" height="30" fill="#333" rx="2"/>
  <text x="510" y="190" font-family="monospace" font-size="10" text-anchor="middle" fill="white">60A 4-in-1</text>

  <!-- Heat sinks -->
  <rect x="450" y="210" width="25" height="35" fill="#999"/>
  <rect x="485" y="210" width="25" height="35" fill="#999"/>
  <rect x="520" y="210" width="25" height="35" fill="#999"/>
  <rect x="555" y="210" width="25" height="35" fill="#999"/>

  <!-- Status badges -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="100" height="30" fill="#4caf50" rx="15"/>
    <text x="50" y="20" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="white">
      IN MARKET
    </text>
  </g>

  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="100" height="30" fill="#4caf50" rx="15"/>
    <text x="50" y="20" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="white">
      SHIPPED
    </text>
  </g>

  <!-- Title -->
  <text x="400" y="330" font-family="Inter, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#1a1a1a">
    GreenStack Flight Electronics
  </text>

  <text x="400" y="355" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" fill="#666">
    F405-M Flight Controller • 60A 4-in-1 ESC
  </text>
</svg>